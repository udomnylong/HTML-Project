<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Input Types Practice Form</h1>
        <form>
            <label for="text">Text:</label>
            <br>
            <input type="text" id="text" name="text" placeholder="Text input" required>
            <br>
            <label for="email">Email:</label>
            <br>
            <input type="email" id="email" name="email" placeholder="Email input" required>
            <br>
            <label for="password">Password:</label>
            <br>
            <input type="password" id="password" name="password" placeholder="Password input" required>
            <br>
            <label for="number">Number:</label>
            <br>
            <input type="number" id="number" name="number" required>
            <br>
            <label for="phone">Phone:</label>
            <br>
            <input type="tel" id="phone" name="phone" placeholder="+855..." required>
            <br>
            <label for="website">Website:</label>
            <br>
            <input type="url" id="website" name="website" placeholder="https://example.com" required>
            <br>
            <label for="date">Date:</label>
            <br>
            <input type="date" id="date" name="date" required>
            <br>
            <label for="time">Time:</label>
            <br>
            <input type="time" id="time" name="time" required>
            <br>
            <label for="datetime-local">Date & Time:</label>
            <br>
            <input type="datetime-local" id="datetime-local" name="datetime-local" required>
            <br>
            <label for="gender">Gender:</label>
            <br>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female" required>
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other" required>
            <label for="other">Other</label>
            <br>
            <label for="hobbies">Hobbies:</label>
            <br>
            <input type="checkbox" id="Football" name="hobbies" value="Football">
            <label for="Football">Football</label>
            <input type="checkbox" id="Coding" name="hobbies" value="Coding">
            <label for="Coding">Coding</label>
            <input type="checkbox" id="Music" name="hobbies" value="Music">
            <label for="Music">Music</label>
            <br>
            <label for="search">Search:</label>
            <br>
            <input type="search" id="search" name="search" placeholder="Search...">
            <br>
            <label for="text">Message:</label>
            <br>
            <textarea id="text" name="message" placeholder="Enter your message here..."></textarea>
            <br>
            <label for="country">Country:</label>
            <br>
            <select id="country" name="country" required>
                <option value="">Select a country</option>
                <option value="us">USA</option>
                <option value="ca">Canada</option>
                <option value="uk">United Kingdom</option>
            </select>
            <br>
            <br>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">



        </form>

    </header>
    <main>
        
    </main>
</body>
</html>
